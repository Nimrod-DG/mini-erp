# Serving a single-page application.
#
# THE `try_files` LINE IS THE WHOLE FILE. Every route in App.tsx is client-side:
# `/procurement/orders/<uuid>/receive` is not a file, and a server that looks for
# one returns 404 on every reload and every pasted link. The acceptance test pastes
# UUIDs into the address bar, so this is load-bearing rather than tidy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames, so these can be cached hard and for a long time.
    # `immutable` is safe precisely because the name changes when the bytes do.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached: it is the only file whose name does not
    # change between releases, and a cached copy points at asset names that no
    # longer exist — a white screen that a hard refresh fixes and nothing else does.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
