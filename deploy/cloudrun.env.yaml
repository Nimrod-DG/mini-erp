# Non-secret environment for the Cloud Run service, passed with
#   gcloud run deploy … --env-vars-file deploy/cloudrun.env.yaml
#
# Committed on purpose: a project ID, a mount path, and two origins. The three
# real credentials arrive separately, with --set-secrets. See docs/DEPLOY.md §6.
#
# A file rather than --set-env-vars because CORS_ORIGINS contains a comma, which
# that flag parses as a separator between variables.

# The Firebase project the API verifies ID tokens against — the DEV project, and
# a different Google account from the one that owns this Cloud Run service. The
# service-account key mounted below is the whole of the bridge between them.
FIREBASE_PROJECT_ID: erp-project-b66ce

# A path, not the key. The Admin SDK reads this variable itself; Cloud Run
# mounts secret erp-firebase-key as a file here.
GOOGLE_APPLICATION_CREDENTIALS: /secrets/firebase/key.json

# The two Firebase Hosting origins, and nothing else. No wildcard (§2.3).
# Add http://localhost:5173 here only if you are pointing a local frontend at
# the deployed API, and take it out again afterwards.
CORS_ORIGINS: https://erp-project-b66ce.web.app,https://erp-project-b66ce.firebaseapp.com
